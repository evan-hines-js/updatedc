{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "updatec.controllerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "updatec.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "updatec.gatewayServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "updatec.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
