# The only node-local configuration. The installer writes this before starting the
# guardian, and mounts the mTLS material it references. Once enrollment.json exists in
# guardian state, enrollment is never retried. The file holds only paths — no secret.
[enrollment]
url = "https://updates.example.com"
client_cert = "/etc/updated/agent-tls/tls.crt"
client_key = "/etc/updated/agent-tls/tls.key"
ca = "/etc/updated/agent-tls/ca.crt"
