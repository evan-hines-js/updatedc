---
# The entire operator-demo UX on ONE server. Run it ON the server:
#
#     cd updated && ansible-playbook deploy/ansible/demo.yml
#
# It installs the deps (docker/kind/kubectl/rust), brings up the kind demo (operator + CDN +
# fleet + Magnolia), routes every endpoint through nginx, and provisions a co-located
# out-of-cluster agent on this same host that doubles as the external Magnolia VM — it reaches
# the in-cluster gateway locally (resolving updatec-gateway to nginx on 127.0.0.1; no socat, no
# LAN-IP). When it finishes, browse to http://<this-server>/ .
- name: updated operator demo (single server)
  hosts: localhost
  connection: local
  become: true
  vars:
    demo_root: "{{ (playbook_dir + '/../..') | realpath }}"
    demo_namespace: updated-system
    demo_cluster: updatec-demo
    demo_kube_context: kind-updatec-demo
    # Hostname handed to `updatec-demo agent-name` below to derive this host's enrollment name.
    # It MUST equal the compiled-in
    # `DEMO_EXTERNAL_VM_HOSTNAME` ("magnolia-manual-vm", crates/updatec-demo/src/layout.rs):
    # `updatec-demo setup` labels the manual Magnolia node by
    # `resource_name(DEMO_EXTERNAL_VM_HOSTNAME)` regardless of what is set here, and the demo UI
    # selects on the labels it patches there (`demo.updated.dev/node` / `/cohort` / `/kind`,
    # `label_external_vm_agent`), not on this variable. Changing it without changing the constant
    # enrolls the agent under a name the demo layer never patches: the labels land on a
    # non-existent UpdateAgent, the `external-vm` cohort stays empty, and the Magnolia group
    # manages no node — the agent runs on this host but never appears in the demo.
    demo_colocated_hostname: magnolia-manual-vm
  roles:
    # Order matters: bring up the cluster + gateway ingress first, then (in tasks, below) enroll
    # the co-located agent, THEN apply the demo layer — which labels that now-enrolled agent into
    # the manual Magnolia group.
    - demo_deps
    - demo_cluster
    - demo_ingress
  tasks:
    # The co-located agent presents the same cert-manager-issued fleet client certificate as the
    # in-cluster agents. It only exists once demo_cluster has run, so it is read here rather than
    # in pre_tasks.
    - name: Read the fleet client identity issued by cert-manager in the cluster
      ansible.builtin.command:
        cmd: >-
          kubectl --context {{ demo_kube_context }} -n {{ demo_namespace }}
          get secret agent-tls -o jsonpath={.data['{{ item }}']}
      register: demo_agent_tls
      changed_when: false
      no_log: true
      loop: [tls.crt, tls.key, ca.crt]

    # The enrollment name this host asserts, taken from the ONE definition of that derivation
    # (`resource_name`, crates/updatec-demo/src/setup.rs) — the same command the in-cluster nodes
    # and the kind e2e use. Never re-derived in Jinja: a hand-written second copy would silently
    # enroll this agent under a name `updatec-demo setup` never labels. `demo_deps` has installed
    # the toolchain by now, and `demo_app` builds this same binary later, so nothing extra is built.
    - name: Derive the co-located agent's enrollment name
      become: false
      ansible.builtin.command:
        cmd: cargo run --release -q -p updatec-demo -- agent-name {{ demo_colocated_hostname | quote }}
        chdir: "{{ demo_root }}"
      environment:
        PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
      register: demo_colocated_agent_name
      changed_when: false

    # A real agent on THIS host, outside kind — the co-located "external VM" that becomes the
    # manual Magnolia node. Same role production fleets
    # use; only the variables differ: the workspace is already here (so it is built in place, no
    # rsync), the gateway names resolve to nginx on 127.0.0.1 (no socat shim), and the enrollment
    # name is the sha-derived resource name the demo layer addresses.
    - name: Install the co-located out-of-cluster agent
      ansible.builtin.include_role:
        name: updated_agent
      vars:
        updatedc_source: "{{ demo_root }}"
        updated_build_dir: "{{ demo_root }}"
        updated_gateway_local_names: true
        updated_hostname: "{{ demo_colocated_agent_name.stdout | trim }}"
        updated_enrollment_client_cert: "{{ demo_agent_tls.results[0].stdout }}"
        updated_enrollment_client_key: "{{ demo_agent_tls.results[1].stdout }}"
        updated_enrollment_ca: "{{ demo_agent_tls.results[2].stdout }}"

    - name: Apply the demo layer
      ansible.builtin.include_role:
        name: demo_app
  post_tasks:
    - name: Where to reach the demo
      ansible.builtin.debug:
        msg: "Demo is up — browse to http://{{ ansible_default_ipv4.address | default('<this-server>') }}/"
