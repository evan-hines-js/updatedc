---
# Apply the demo layer on top of the provisioned cluster: scale the fleet, create the
# groups/sets, the per-set load-balancer services + ingress, the reconciler, and label the
# already-enrolled co-located agent into the manual Jenkins group. `setup` applies and exits
# (no port-forward, no chaos loop — the in-cluster UI pod serves the UI, reached via nginx).
- name: Apply the demo layer
  ansible.builtin.command:
    cmd: cargo run --release -p updatec-demo -- setup
    chdir: "{{ demo_root }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
    UPDATEC_DEMO_CLUSTER: "{{ demo_cluster }}"
    DEMO_DISABLE_CHAOS: "{{ demo_disable_chaos | default('') }}"
