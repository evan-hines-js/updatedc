---
# Build the agent from source on the target (native binaries, no cross-compile) and run it as
# a systemd service that enrolls with the control plane.

- name: Install build and runtime dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake          # aws-lc-rs (the one crypto lib) builds C via cmake
      - clang
      - pkg-config
      - curl
      - ca-certificates
      - socat
    state: present
    update_cache: true

- name: Install the Rust toolchain (rustup)
  become: false
  ansible.builtin.shell: >
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
  args:
    creates: "{{ ansible_env.HOME }}/.cargo/bin/cargo"

- name: Synchronize the updatedc source
  become: false
  ansible.posix.synchronize:
    src: "{{ updatedc_source | default(updated_source) }}/"
    dest: "{{ ansible_env.HOME }}/updatedc-src/"
    delete: false
    rsync_opts:
      - "--exclude=target"
      - "--exclude=.git"

- name: Build the agent binaries
  become: false
  ansible.builtin.shell: >
    . "{{ ansible_env.HOME }}/.cargo/env" &&
    cargo build --release -p bootstrap -p supervisor
  args:
    chdir: "{{ ansible_env.HOME }}/updatedc-src"

- name: Install the agent binaries
  ansible.builtin.copy:
    remote_src: true
    src: "{{ ansible_env.HOME }}/updatedc-src/target/release/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - bootstrap
    - supervisor

# ── Reachability shim (demo only) ─────────────────────────────────────────────
# In production the agent points straight at the real gateway URL. For the local kind demo the
# gateway lives in-cluster, exposed on the laptop's LAN, so map its in-cluster hostnames to a
# local socat forward — the agent then uses the identical config the in-cluster pods use.
- name: Resolve in-cluster gateway names locally (demo)
  when: updated_demo_shim_host is defined
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} updated demo gateway shim"
    block: "127.0.0.1 updatec-gateway release-default"

- name: Forward the gateway to the laptop (demo)
  when: updated_demo_shim_host is defined
  ansible.builtin.template:
    src: updated-gateway-shim.service.j2
    dest: /etc/systemd/system/updated-gateway-shim.service
    mode: "0644"

- name: Start the gateway shim (demo)
  when: updated_demo_shim_host is defined
  ansible.builtin.systemd:
    name: updated-gateway-shim
    state: restarted
    enabled: true
    daemon_reload: true

# ── Agent service ─────────────────────────────────────────────────────────────
- name: Pin the enrollment identity from the hostname
  # The guardian's enrollment nonce is sha256(hostname); pinning it lets the control plane
  # address this node deterministically (mirrors the container entrypoint).
  ansible.builtin.shell: |
    mkdir -p /var/lib/updated/guardian
    printf %s "{{ updated_hostname }}" | sha256sum | cut -d' ' -f1 \
      > /var/lib/updated/guardian/registration-nonce
  args:
    creates: /var/lib/updated/guardian/registration-nonce

- name: Ensure the agent mTLS directory exists
  ansible.builtin.file:
    path: /etc/updated/agent-tls
    state: directory
    mode: "0700"

- name: Write the agent mTLS identity (client cert, key, fleet CA)
  ansible.builtin.copy:
    dest: "/etc/updated/agent-tls/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0600"
  loop:
    - { name: tls.crt, content: "{{ updated_enrollment_client_cert | b64decode }}" }
    - { name: tls.key, content: "{{ updated_enrollment_client_key | b64decode }}" }
    - { name: ca.crt, content: "{{ updated_enrollment_ca | b64decode }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Write the bootstrap enrollment config
  ansible.builtin.template:
    src: bootstrap.toml.j2
    dest: /etc/updated/bootstrap.toml
    mode: "0600"

- name: Install the agent service
  ansible.builtin.template:
    src: updated-agent.service.j2
    dest: /etc/systemd/system/updated-agent.service
    mode: "0644"

- name: Start the agent
  ansible.builtin.systemd:
    name: updated-agent
    state: restarted
    enabled: true
    daemon_reload: true
