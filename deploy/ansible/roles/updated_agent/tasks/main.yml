---
# Build the agent from source on the target (native binaries, no cross-compile) and run it as
# a systemd service that enrolls with the control plane. This is the ONE way an agent is
# installed on a host — production fleet (install-agent.yml) and demo (demo.yml) alike; the
# demo only supplies different variables.

- name: Install build and runtime dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake          # aws-lc-rs (the one crypto lib) builds C via cmake
      - clang
      - pkg-config
      - curl
      - ca-certificates
      - socat
    state: present
    update_cache: true

- name: Install the Rust toolchain (rustup)
  become: false
  ansible.builtin.shell: >
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
  args:
    creates: "{{ ansible_env.HOME }}/.cargo/bin/cargo"

- name: Synchronize the updatedc source
  become: false
  when: updated_build_dir != updatedc_source
  ansible.posix.synchronize:
    src: "{{ updatedc_source }}/"
    dest: "{{ updated_build_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=target"
      - "--exclude=.git"

- name: Build the agent binaries
  become: false
  ansible.builtin.shell: >
    . "{{ ansible_env.HOME }}/.cargo/env" &&
    cargo build --release -p launcher -p agent
  args:
    chdir: "{{ updated_build_dir }}"

- name: Install the agent binaries
  ansible.builtin.copy:
    remote_src: true
    src: "{{ updated_build_dir }}/target/release/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - updated-launcher
    - updated-agent

# ── Reachability (demo only) ──────────────────────────────────────────────────
# In production the agent points straight at the real gateway URL. For a kind demo the gateway
# lives in-cluster: the co-located demo publishes it on this host's port 80 through nginx, and the
# LAN-VM demo forwards to the laptop with socat. Either way the agent keeps the identical config
# the in-cluster pods use — only /etc/hosts changes.
- name: Resolve in-cluster gateway names locally (demo)
  when: updated_gateway_local_names | bool
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} updated demo gateway names"
    block: "127.0.0.1 updatec-gateway release-default"

- name: Forward the gateway to the laptop (demo)
  when: updated_demo_shim_host is defined
  ansible.builtin.template:
    src: updated-gateway-shim.service.j2
    dest: /etc/systemd/system/updated-gateway-shim.service
    mode: "0644"

- name: Start the gateway shim (demo)
  when: updated_demo_shim_host is defined
  ansible.builtin.systemd:
    name: updated-gateway-shim
    state: restarted
    enabled: true
    daemon_reload: true

# ── Agent service ─────────────────────────────────────────────────────────────
- name: Ensure the agent mTLS directory exists
  ansible.builtin.file:
    path: /etc/updated/agent-tls
    state: directory
    mode: "0700"

- name: Write the agent mTLS identity (client cert, key, fleet CA)
  ansible.builtin.copy:
    dest: "/etc/updated/agent-tls/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0600"
  loop:
    - { name: tls.crt, content: "{{ updated_enrollment_client_cert | b64decode }}" }
    - { name: tls.key, content: "{{ updated_enrollment_client_key | b64decode }}" }
    - { name: ca.crt, content: "{{ updated_enrollment_ca | b64decode }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Write the launcher enrollment config
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/updated/config.toml
    mode: "0600"

- name: Install the agent service
  ansible.builtin.template:
    src: updated-agent.service.j2
    dest: /etc/systemd/system/updated-agent.service
    mode: "0644"

- name: Start the agent
  ansible.builtin.systemd:
    name: updated-agent
    state: restarted
    enabled: true
    daemon_reload: true
