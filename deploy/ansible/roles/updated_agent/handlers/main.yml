---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Restarting the agent never disturbs a host-managed workload: workload processes belong to each release's
# own reconciler hooks and their own units, never to this one. Skipped when the play deliberately
# staged the fleet without starting it.
- name: Restart the updated agent
  when: updated_agent_started
  ansible.builtin.systemd_service:
    name: updated-agent
    state: restarted
    daemon_reload: true
