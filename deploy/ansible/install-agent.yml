---
# Bootstrap a fleet of hosts onto an `updated` control plane. The VM-fleet counterpart to the
# Helm chart: the same agent the published release ships, placed by Ansible instead
# of by a pod spec, enrolling with the same control plane.
#
# This play owns agent installation and upgrades through the host's package/configuration manager.
# The fleet's signed TUF channel manages workload releases and desired configuration.
#
# Required vars (see roles/updated_agent/defaults/main.yml):
#   updated_enrollment_url  the control plane's gateway URL (https, mutual TLS)
#   updated_enrollment_client_cert / _client_key / _ca
#                           base64 PEM of this node's client certificate, its key, and the fleet
#                           CA. Per-node certificates, ideally from your own PKI and pulled from
#                           your secret store per host — not one certificate shared fleet-wide.
# Common overrides:
#   updated_release_tag        which published release to install (default: latest)
#   updated_verify_attestation true to additionally check the build's signed provenance with
#                              `gh attestation verify` on each target
#   updated_release_local_dir  install from artifacts staged on the control node (air-gapped)
#   updated_hostname           how the control plane addresses this node (default: inventory name)
#   updated_agent_started      false to stage the fleet without starting it
- name: Install the updated agent
  hosts: updated_agents
  become: true
  gather_facts: false
  pre_tasks:
    # A freshly-imaged VM may lack the python ansible's modules need; install it raw.
    - name: Bootstrap python for ansible
      ansible.builtin.raw: >
        test -e /usr/bin/python3 ||
        (apt-get update && apt-get install -y python3) ||
        (dnf install -y python3) ||
        (yum install -y python3)
      changed_when: false
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - updated_agent
