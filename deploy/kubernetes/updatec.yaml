apiVersion: v1
kind: ServiceAccount
metadata: {name: updatec, namespace: updated-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: updatec, namespace: updated-system}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["updated.dev"]
    resources: ["updatedgroups", "updatednodes", "updatedrepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: updatec, namespace: updated-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: updatec}
subjects:
  - {kind: ServiceAccount, name: updatec, namespace: updated-system}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: updatec-controller, namespace: updated-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: updatec-controller}}
  template:
    metadata: {labels: {app: updatec-controller}}
    spec:
      serviceAccountName: updatec
      securityContext:
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: updatec
          image: updatec:kind
          imagePullPolicy: IfNotPresent
          args: [controller]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          env:
            - {name: UPDATED_NAMESPACE, value: updated-system}
            - {name: UPDATED_REPOSITORY, value: default}
            - {name: RUST_LOG, value: info}
          volumeMounts:
            - {name: state, mountPath: /var/lib/updatec}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: updatec-state}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: updatec-gateway, namespace: updated-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: updatec-gateway}}
  template:
    metadata: {labels: {app: updatec-gateway}}
    spec:
      serviceAccountName: updatec
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: updatec
          image: updatec:kind
          imagePullPolicy: IfNotPresent
          args: [serve]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: "1", memory: 256Mi}
          env:
            - {name: UPDATED_NAMESPACE, value: updated-system}
            - {name: UPDATED_REPOSITORY, value: default}
            - {name: UPDATED_LISTEN, value: "0.0.0.0:8080"}
            - {name: RUST_LOG, value: info}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: updatec-gateway, namespace: updated-system}
spec:
  selector: {app: updatec-gateway}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: updatec-state, namespace: updated-system}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
