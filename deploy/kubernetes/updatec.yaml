apiVersion: v1
kind: ServiceAccount
metadata: {name: updatec, namespace: updated-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: updatec, namespace: updated-system}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create"]
  # The durable rollout-admission set (per-group pinned deployment) lives in a ConfigMap in etcd, not
  # on the node-local PVC, so it survives a leader change / cold PVC and the throttle can never
  # re-baseline and mass-admit a set. get_opt + create + replace(CAS) is get/create/update.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["updated.dev"]
    resources: ["updategroups", "updategroupsets", "updateagents", "updaterepositories", "updatesubscriptions"]
    verbs: ["get", "list", "watch", "create"]
  # `/enroll` completes an operator-reserved (`identity.kind: reserved`) UpdateAgent in place — it stamps the node's
  # minted identity (pinned public key + registration) onto the agent and flips it to `Enrolled` via a
  # resourceVersion-guarded replace — so the gateway needs `update` on the main updateagents resource.
  - apiGroups: ["updated.dev"]
    resources: ["updateagents"]
    verbs: ["update"]
  # The controller finalizes its UpdateRepository: it patches `.metadata.finalizers` to hold a deleted
  # repository open until its published TUF prefix is pruned from object storage (state Kubernetes GC
  # cannot reach), then patches the finalizer off so deletion completes. That is a patch of the main
  # resource, distinct from the `/status` patch below.
  - apiGroups: ["updated.dev"]
    resources: ["updaterepositories"]
    verbs: ["patch", "update"]
  - apiGroups: ["updated.dev"]
    resources: ["updategroups/status", "updategroupsets/status", "updateagents/status", "updaterepositories/status", "updatesubscriptions/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: updatec, namespace: updated-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: updatec}
subjects:
  - {kind: ServiceAccount, name: updatec, namespace: updated-system}
---
# Cluster-wide LIST on updaterepositories, and nothing else. Before pruning a deleted repository's
# S3 prefix the finalizer looks for another UpdateRepository whose prefix overlaps it in the same
# bucket, because an object-store list is prefix-scoped: deleting `fleet` would sweep a live
# `fleet/staging`. A bucket is not scoped to a namespace, so that search cannot be either — scoped
# to one namespace it missed exactly the cross-tenant nesting it exists to catch. Read-only, one
# resource, one verb; every mutation stays in the namespaced Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: updatec-repository-reader}
rules:
  - apiGroups: ["updated.dev"]
    resources: ["updaterepositories"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: updatec-repository-reader}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: updatec-repository-reader}
subjects:
  - {kind: ServiceAccount, name: updatec, namespace: updated-system}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: updatec-controller, namespace: updated-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: updatec-controller}}
  template:
    metadata: {labels: {app: updatec-controller}}
    spec:
      serviceAccountName: updatec
      securityContext:
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: updatec
          image: updatec:kind
          imagePullPolicy: IfNotPresent
          args: [controller]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          env:
            - {name: UPDATED_NAMESPACE, value: updated-system}
            - {name: UPDATED_REPOSITORY, value: default}
            - {name: UPDATED_PUBLIC_URL, value: "https://updates.example/routing"}
            - {name: RUST_LOG, value: info}
          volumeMounts:
            - {name: state, mountPath: /var/lib/updatec}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # This PVC holds only rebuildable local caches (the signed TUF repository dir + materialized
        # signing keys, kept for TUF version monotonicity). It is NOT the source of truth for rollout
        # admission — that state is a ConfigMap in etcd (see the configmaps RBAC rule above), so
        # losing or reattaching this RWO PVC across a leader change never disables the throttle.
        - name: state
          persistentVolumeClaim: {claimName: updatec-state}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: updatec-gateway, namespace: updated-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: updatec-gateway}}
  template:
    metadata: {labels: {app: updatec-gateway}}
    spec:
      serviceAccountName: updatec
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: updatec
          image: updatec:kind
          imagePullPolicy: IfNotPresent
          args: [serve]
          ports:
            - {name: http, containerPort: 8080}
            # Plaintext health port for the kubelet probes, which cannot present a client cert.
            - {name: health, containerPort: 8081}
          readinessProbe: {httpGet: {path: /healthz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: "1", memory: 256Mi}
          env:
            - {name: UPDATED_NAMESPACE, value: updated-system}
            - {name: UPDATED_REPOSITORY, value: default}
            - {name: UPDATED_LISTEN, value: "0.0.0.0:8080"}
            - {name: UPDATED_ISSUING_CA_DIR, value: /etc/issuing-ca}
            - {name: UPDATED_PUBLIC_URL, value: "https://updates.example/routing"}
            - {name: UPDATED_GATEWAY_TLS_DIR, value: /etc/gateway-tls}
            - {name: RUST_LOG, value: info}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # The gateway is externally exposed, so it terminates mTLS. cert-manager issues its
            # server cert + the fleet CA into this secret (tls.crt/tls.key/ca.crt).
            - {name: gateway-tls, mountPath: /etc/gateway-tls, readOnly: true}
            # The fleet CA *with its private key*, so the /enroll handler can sign a node's CSR into
            # a per-node client cert the mTLS listener accepts. Holding the CA key here widens the
            # gateway's blast radius; see docs/group-enrollment-design.md.
            - {name: issuing-ca, mountPath: /etc/issuing-ca, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        - name: gateway-tls
          secret: {secretName: gateway-tls}
        - name: issuing-ca
          secret: {secretName: fleet-ca}
---
apiVersion: v1
kind: Service
metadata: {name: updatec-gateway, namespace: updated-system}
spec:
  selector: {app: updatec-gateway}
  # Agents reach the gateway at `https://updatec-gateway` (port 443) under mTLS; map that to the
  # container's mTLS data port. The plaintext health port is probe-only and not exposed here.
  ports:
    - {name: https, port: 443, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: updatec-state, namespace: updated-system}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
