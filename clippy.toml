# Workspace-wide bans on functions that must have exactly one caller.
#
# These are enforced by `cargo clippy -- -D warnings`, which CI runs over `--all-targets
# --all-features`. That matters more than it looks: the ban resolves each call to its definition,
# so it cannot be evaded by importing the function and calling it bare, and it covers every file in
# the workspace automatically — including ones that do not exist yet. A guard that enumerates the
# files it checks silently stops covering the crate the moment a module is added or split.
#
# Every legitimate caller carries `#[allow(clippy::disallowed_methods)]` with the reason it is the
# one door. That allow is the exception list, and it lives at the exception.
disallowed-methods = [
  { path = "updated_agent::store::Store::verify_release", reason = "raw half of activation; use Store::activate so verifying bytes and moving the active pointer remain one fail-closed operation." },
  { path = "updated_agent::store::Store::point_active", reason = "raw half of activation; use Store::activate so no caller can point at bytes it did not just verify." },
  { path = "updated_agent::store::Store::record_journal", reason = "unconditional storage primitive; use Store::write_journal so transaction identity and phase monotonicity cannot be bypassed." },
  { path = "updated_agent::store::Store::remove_journal", reason = "unconditional storage primitive; use Store::clear_journal so an outstanding compensation obligation cannot be discarded." },
  { path = "updated_agent::store::Store::record_install_journal", reason = "unconditional storage primitive; use Store::write_install_journal so interrupted first-install intent cannot be buried." },
  { path = "updated_agent::store::Store::remove_install_journal", reason = "unconditional storage primitive; use Store::clear_install_journal so install intent survives until the exact release commits." },
  { path = "updated::bundle::write_active", reason = "raw active-pointer writer; production activation must pass through updated-agent Store::activate, which verifies immutable bytes first and keeps every activation failure node-local." },
  { path = "updated::state::write_installed", reason = "raw installed-state writer; updated-agent Store is the one durable policy boundary for committing installed state." },
  { path = "updated::journal::write", reason = "raw journal writer; updated-agent Store::write_journal and Store::write_install_journal enforce identity and state-machine replacement rules." },
  { path = "updated::journal::clear", reason = "raw journal remover; updated-agent Store clear methods prove the recorded obligation is discharged before deleting it." },
]
