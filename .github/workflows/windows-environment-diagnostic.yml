name: Windows environment diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  environment:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cases = @(
            @{Name='ambient'; Extra=@()},
            @{Name='ambient-pinned-modules'; Extra=@()},
            @{Name='baseline'; Extra=@()},
            @{Name='modulepath'; Extra=@()},
            @{Name='path'; Extra=@()},
            @{Name='pathext'; Extra=@('PATHEXT')},
            @{Name='policy'; Extra=@()},
            @{Name='policy-env'; Extra=@('PSExecutionPolicyPreference')},
            @{Name='modulecache'; Extra=@('PSModuleAnalysisCachePath')}
          )
          foreach ($case in $cases) {
            $start = New-Object System.Diagnostics.ProcessStartInfo
            $start.FileName = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
            $start.UseShellExecute = $false
            $start.RedirectStandardInput = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            if (-not $case.Name.StartsWith('ambient')) {
              $start.EnvironmentVariables.Clear()
              foreach ($name in (@('SystemRoot','WINDIR','TEMP','TMP','SystemDrive','LOCALAPPDATA') + $case.Extra)) {
                $value = [Environment]::GetEnvironmentVariable($name)
                if ($null -ne $value) { $start.EnvironmentVariables[$name] = $value }
              }
              $start.EnvironmentVariables['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
              $start.EnvironmentVariables['PSModulePath'] = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
            }
            if ($case.Name -eq 'ambient-pinned-modules') {
              $start.EnvironmentVariables['PSModulePath'] = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
            }
            if ($case.Name -eq 'modulepath') { $start.EnvironmentVariables['PSModulePath'] = $env:PSModulePath }
            if ($case.Name -eq 'path') { $start.EnvironmentVariables['PATH'] = $env:PATH }
            $script = '$p=[IO.Path]::GetTempFileName(); Set-Content -NoNewline -Path $p -Value ready; Get-Content -Raw $p; Remove-Item $p'
            $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
            $start.Arguments = "-NoLogo -NoProfile -NonInteractive -EncodedCommand $encoded"
            if ($case.Name -eq 'policy') { $start.Arguments = "-ExecutionPolicy Bypass " + $start.Arguments }
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $process = [Diagnostics.Process]::Start($start)
            $process.StandardInput.Close()
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(15000)) {
              $process.Kill()
              $process.WaitForExit()
              Write-Host "$($case.Name): TIMEOUT after 15s"
            } else {
              Write-Host "$($case.Name): $($watch.Elapsed.TotalSeconds)s exit=$($process.ExitCode) stdout=$($stdout.Result.Trim()) stderr=$($stderr.Result.Trim())"
            }
            $process.Dispose()
          }
