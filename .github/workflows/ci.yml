name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Version tags for the official image are immutable.
      image: semgrep/semgrep:1.170.0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan source code
        run: semgrep scan --config auto --error .

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is Intel; macos-14 is a native Apple Silicon runner. Keeping
        # both makes the advertised x86-64/aarch64 support part of CI rather than
        # relying only on cross-compilation.
        include:
          - os: ubuntu-latest
            release: linux-x86_64
          - os: macos-15-intel
            release: macos-x86_64
          - os: macos-14
            release: macos-aarch64
          - os: windows-latest
            release: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      # aws-lc-rs (via the `tough` TUF client) builds its C with CMake on every
      # OS — preinstalled on the runners — plus NASM on Windows MSVC, which is not.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      # Compile and run the test artifacts first. Clippy then reuses Cargo's
      # dependency artifacts and analyzes only this workspace's code.
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      # Portable updater scenarios run identically on every OS. The arbitrary-kill fuzzer
      # (killfuzz) runs concurrently with the suite on Unix: it SIGKILLs whole process trees at
      # random instants (its reaper shells out to `pkill`, so it is Unix-only). The two coexist by
      # construction — separate lock files (`target/{e2e,killfuzz}.lock`) and separate
      # `CARGO_TARGET_DIR`s (`target/{e2e,killfuzz}-cargo`) — so neither clobbers the other's build
      # output or workdir. The step fails if either the suite or the fuzzer fails.
      - name: Updater E2E suite (kill fuzzer in parallel on Unix)
        shell: bash
        run: |
          set -uo pipefail
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            cargo run -p killfuzz &
            killfuzz_pid=$!
          fi
          cargo run -p e2e
          e2e_rc=$?
          if [[ -n "${killfuzz_pid:-}" ]]; then
            wait "$killfuzz_pid"
            killfuzz_rc=$?
          else
            killfuzz_rc=0
          fi
          echo "e2e exit=$e2e_rc, killfuzz exit=$killfuzz_rc"
          [[ $e2e_rc -eq 0 && $killfuzz_rc -eq 0 ]]

      # A main build produces the continuously-running update tower for each desktop
      # target.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cargo build --release -p bootstrap -p supervisor
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cargo build --release -p windows-service
          fi
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/updated-${{ matrix.release }}.tar.gz" \
            bootstrap supervisor
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $files = @(
            "target/release/bootstrap.exe"
            "target/release/supervisor.exe"
            "target/release/selfupdate-service.exe"
          )
          Compress-Archive -Path $files -DestinationPath "dist/updated-${{ matrix.release }}.zip"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updated-${{ matrix.release }}
          path: dist/*
          if-no-files-found: error

  windows-scm-e2e:
    name: Windows Service Control Manager E2E
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # aws-lc-rs requires NASM when building for Windows MSVC.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Exercise native service registration, durable bootstrap state, clean
      # application shutdown, and relaunch after an SCM service restart.
      - name: Exercise the native SCM lifecycle
        shell: powershell
        run: .\deploy\windows\test-scm-e2e.ps1

  linux-haproxy-e2e:
    name: Linux real HAProxy binary reload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install HAProxy test dependencies
        run: sudo apt-get update && sudo apt-get install -y haproxy
      - name: Exercise real master-worker binary upgrades
        run: ./scripts/linux-haproxy-e2e.sh
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-haproxy-e2e-logs
          path: target/haproxy-e2e/*.log
          if-no-files-found: warn

  updatec-e2e:
    name: updatec (Kind + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with: {install_only: true}
      - run: ./scripts/kind-updatec-e2e.sh
      - if: failure()
        run: kubectl -n updated-system logs deployment/updatec || true

  updatec-demo-e2e:
    name: one-click operator fleet demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with: {install_only: true}
      # The single pass/fail demo e2e: stands up the kind cluster (operator + CDN + fleet +
      # Magnolia) and asserts fleet convergence, set isolation, external-endpoint reconciliation,
      # ordered lifecycle hooks, and group rollback. `--exit` returns 0 on "E2E PASS", non-zero on
      # any failed assertion. (`scripts/demo.sh` is the human, ansible/VM bring-up path, not this.)
      - name: Exercise UI publication, lifecycle hooks, per-node failure, rollback, and upgrade
        run: cargo run -p updatec-demo -- e2e --exit
      - name: Preserve demo diagnostics
        if: failure()
        run: |
          kubectl -n updated-system get pods,updateagents,updategroups -o wide || true
          kubectl -n updated-system logs deployment/updatec-controller --tail=200 || true
          kubectl -n updated-system logs deployment/updatec-demo --tail=200 || true

  release:
    name: Publish immutable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, semgrep, trivy, windows-scm-e2e, linux-haproxy-e2e, updatec-e2e, updatec-demo-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # `gh release` resolves the repository from the checkout. Artifact-only jobs have
      # no Git context and fail with "not a git repository" before uploading anything.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: updated-*
          path: dist
          merge-multiple: true
      - name: Verify all platform packages were downloaded
        shell: bash
        run: |
          packages=(
            dist/updated-linux-x86_64.tar.gz
            dist/updated-macos-x86_64.tar.gz
            dist/updated-macos-aarch64.tar.gz
            dist/updated-windows-x86_64.zip
          )
          for package in "${packages[@]}"; do
            test -s "$package" || {
              echo "Missing or empty release package: $package" >&2
              exit 1
            }
          done
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum updated-* > SHA256SUMS
      - name: Attest release packages and checksums
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/updated-*
            dist/SHA256SUMS
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=(
            dist/updated-linux-x86_64.tar.gz
            dist/updated-macos-x86_64.tar.gz
            dist/updated-macos-aarch64.tar.gz
            dist/updated-windows-x86_64.zip
            dist/SHA256SUMS
          )
          release_tag="build-$GITHUB_SHA"
          gh release create "$release_tag" "${packages[@]}" \
            --target "$GITHUB_SHA" \
            --title "Verified build $GITHUB_SHA" \
            --notes "Immutable, attested build of main at $GITHUB_SHA."
          release_assets="$(gh release view "$release_tag" --json assets --jq '.assets[].name')"
          for package in "${packages[@]}"; do
            name="${package##*/}"
            grep -Fxq "$name" <<<"$release_assets" || {
              echo "Release is missing uploaded package: $name" >&2
              exit 1
            }
          done
