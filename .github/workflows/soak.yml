name: Scheduled soak

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: Fleet fuzz generations
        required: false
        default: "20"

jobs:
  updatec-fleet:
    name: updatec fleet fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: {toolchain: 1.95.0}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with: {install_only: true}
      - name: Run the extended deterministic fleet soak
        env:
          UPDATEC_FUZZ_SEED: "20260718"
          UPDATEC_FUZZ_ROUNDS: ${{ inputs.rounds || '20' }}
        run: ./scripts/ci.sh kind
      - name: Preserve diagnostics
        if: failure()
        run: |
          kubectl -n updated-system get pods,jobs,updateagents,updategroups,updaterepositories -o wide || true
          kubectl -n updated-system logs deployment/updatec-controller || true
          kubectl -n updated-system logs deployment/updatec-gateway || true
