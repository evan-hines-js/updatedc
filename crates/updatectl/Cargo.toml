[package]
name = "updatectl"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "updatectl"
path = "src/main.rs"

[dependencies]
clap.workspace = true
futures.workspace = true
kube.workspace = true
object_store.workspace = true
semver.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
# Reused so CI publication uses the exact same bundle format, TUF authoring, S3
# object layout, and CRD types as the operator — one code path, no drift.
updated = { path = "../updated" }
updated-contracts = { path = "../updated-contracts" }
updated-tuf = { path = "../updated-tuf" }
updatec = { path = "../updatec" }

[dev-dependencies]
# Integration tests drive the S3 round-trip against an in-memory object store and verify the
# result through the real TUF client — no MinIO or cluster required.
tough.workspace = true
url.workspace = true
