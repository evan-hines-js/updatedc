[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
foundation = { path = "../foundation" }
updated = { path = "../updated" }
updated-contracts = { path = "../updated-contracts" }
updated-tuf = { path = "../updated-tuf" }
# The private capability fixture answers the same repository requests as the production gateway,
# so it serves the gateway's request grammar (`updatec::served`) rather than a second copy of it.
updatec = { path = "../updatec" }
tokio = { workspace = true }
serde_json = { workspace = true }
same-file = { workspace = true }
# Mint the fixture TLS material (fleet CA, server cert, agent client cert) like TUF keys. The
# capability listener validates identities when they are presented; the object listener presents
# only its server certificate and never asks for a node identity.
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The connection deadline is minutes long; `test-util`'s paused clock exercises it in milliseconds.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[features]
fips = ["updated/fips"]
