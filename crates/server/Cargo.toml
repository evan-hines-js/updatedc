[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
foundation = { path = "../foundation" }
updated = { path = "../updated" }
updated-contracts = { path = "../updated-contracts" }
updated-tuf = { path = "../updated-tuf" }
# The dev CDN answers the same repository requests the production gateway does, so it serves the
# gateway's request grammar (`updatec::served`) rather than a second copy of it.
updatec = { path = "../updatec" }
tokio = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }
same-file = { workspace = true }
# Mint the mTLS material (fleet CA, gateway server cert, agent client cert) like TUF keys,
# and terminate mTLS on the mock CDN listener so it mirrors the gateway's client-cert gate.
rcgen = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
# Sign a node report the way an agent does, so the telemetry write/read round trip is
# exercised end to end rather than by hand-placing a file.
aws-lc-rs = { workspace = true }
# The connection deadline is minutes long; `test-util`'s paused clock exercises it in milliseconds.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[features]
fips = ["updated/fips"]
