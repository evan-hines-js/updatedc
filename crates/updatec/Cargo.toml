[package]
name = "updatec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
# Outbound webhook delivery for UpdateSubscription (change-tracking push); rustls via the workspace.
reqwest = { workspace = true }
# HMAC-SHA256 signing of webhook bodies — the one crypto library (same backend as the gateway mTLS).
aws-lc-rs = { workspace = true }
# The gateway HTTP data plane is Axum over hyper; hyper-util drives the per-connection serve loop
# behind our own tokio-rustls accept loops (so TLS/mTLS and the aws-lc-rs provider stay ours).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path", "original-uri"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# Request timeout middleware for the gateway routers (bounds slow-loris body reads); returns 408
# rather than dropping the connection.
tower-http = { version = "0.6", features = ["timeout"] }
chrono.workspace = true
futures.workspace = true
foundation = { path = "../foundation" }
hex.workspace = true
# Draupnir's admission decision signature travels base64 in a header; the pinned key is hex, like
# every other pinned key here.
base64.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
object_store.workspace = true
rustls.workspace = true
# The gateway is externally exposed, so it terminates mTLS: aws-lc-rs rustls, required client cert.
tokio-rustls = { workspace = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
updated = { path = "../updated" }
updated-contracts = { path = "../updated-contracts" }
updated-tuf = { path = "../updated-tuf" }
# The join endpoint parses and signs agent CSRs with the fleet CA (aws-lc-rs backend, one crypto
# library). Its CSR parse verifies the self-signature, so reading the key to pin it and signing it
# share one proof-of-possession check.
rcgen = { workspace = true, features = ["x509-parser"] }
tempfile.workspace = true
# The mTLS data listener reads the verified leaf's Common Name to authorize per-node telemetry
# writes (the trusted identity, vs the node's self-claimed path); join tests also introspect leaves.
x509-parser = { workspace = true }

[dev-dependencies]
base64.workspace = true
# Only the `crdgen` example renders the CRDs as YAML; nothing in the shipped library or binary
# does, so it links against the example alone.
serde_yaml.workspace = true
# Collect a request body in the fake apiserver `crate::tests::apiserver` serves `kube::Client` from.
http-body-util = "0.1"
# Drive Axum routers directly in gateway tests via `ServiceExt::oneshot`, no socket needed.
tower = { version = "0.5", features = ["util"] }
# Test-only: compile the CEL regexes out of the rendered write-boundary policy and check them
# against the names this controller actually generates. Nothing shipped depends on a regex engine
# (see `foundation::digest`); asserting the policy's regex TEXT instead would be brittle, because
# `0[0-9]|[1-5][0-9]` and `[0-5][0-9]` are the same rule spelled two ways.
regex = "1"
# The gateway's connection deadline is half an hour; `test-util`'s paused clock exercises it in
# milliseconds, the same way the directory repository fixture tests its own.
tokio = { workspace = true, features = ["test-util"] }

[features]
fips = ["updated/fips"]
