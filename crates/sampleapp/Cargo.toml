[package]
name = "sampleapp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/main.rs"

[[bin]]
name = "sampleapp"
path = "src/bin/sampleapp.rs"

[[bin]]
name = "stateful-like"
path = "src/bin/stateful-like.rs"

[dependencies]
serde.workspace = true
toml.workspace = true
# SO_REUSEADDR so a fresh instance can rebind the port immediately after the
# release's own reconciler stops the previous one.
socket2 = "0.5"

[dev-dependencies]
# The launch-path regression test resolves a real signed bundle through the same
# provider the agent's reconciler resolves, then execs this crate's real binary against it.
updated = { path = "../updated" }
tempfile.workspace = true
