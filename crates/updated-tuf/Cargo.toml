[package]
name = "updated-tuf"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
updated = { path = "../updated" }
updated-contracts = { path = "../updated-contracts" }
foundation = { path = "../foundation" }
tough = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
semver = { workspace = true }
# Hex-encoding a verified target's content hash (updated_tuf::select::target_sha).
hex = { workspace = true }
aws-lc-rs = { workspace = true }
jiff = { workspace = true }
futures = { workspace = true }
# The agent's mTLS transport to the gateway for all TUF metadata/target fetches.
reqwest = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
fips = ["updated/fips"]
