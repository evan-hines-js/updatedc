[package]
name = "foundation"
version.workspace = true
edition.workspace = true
license.workspace = true

# Shared mechanisms only: no serialization, async runtime, crypto policy, configuration,
# or application crates.
# Platform binding crates are the sole permitted dependencies (they are ABI-correct
# type/constant/function declarations, not behaviour) — the `process` module's
# process-group/job-object containment and the confined-open handle proof need them.

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
