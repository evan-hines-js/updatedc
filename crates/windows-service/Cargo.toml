[package]
name = "windows-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "selfupdate-service"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# The bootstrap is spawned as a contained tree: the kill-on-close job object is what makes it
# impossible for a bootstrap to outlive this wrapper and have the SCM start a second guardian
# over the same state directory.
foundation = { path = "../foundation" }
