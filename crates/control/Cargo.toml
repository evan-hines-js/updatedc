[package]
name = "control"
version.workspace = true
edition.workspace = true
license.workspace = true

# The frozen launcher⇄agent control protocol: the one wire contract shared by the
# permanent launcher (`launcher`) and the disposable `agent`. It depends only on the
# dependency-isolated `foundation` mechanisms already shared across that process boundary; it
# must not drag policy-tower churn into the launcher. It changes only when the protocol itself
# changes, which both sides must track together. There is one mandatory operation set and one
# version gate; no feature negotiation or compatibility response exists inside it.
[lib]
name = "control"
path = "src/lib.rs"

[dependencies]
foundation = { path = "../foundation" }
