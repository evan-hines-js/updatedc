[package]
name = "updated-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true

# Serialized cross-process contracts and their canonical authenticity rules. This crate must not
# depend on the node runtime (`updated`), TUF, an async runtime, HTTP, or Kubernetes.
[dependencies]
foundation = { path = "../foundation" }
serde.workspace = true
# Schema derivation for the managed-runtime policy structs the control plane's CRD embeds
# verbatim. The CRD must not re-declare them: a second copy is a copy that drifts.
schemars.workspace = true
serde_json.workspace = true
aws-lc-rs.workspace = true
hex.workspace = true
base64.workspace = true
url.workspace = true
semver.workspace = true
