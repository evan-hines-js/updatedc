apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: updatec-soak-campaign
  namespace: monitoring
  labels:
    app.kubernetes.io/name: updatec-soak-campaign
    app.kubernetes.io/part-of: updatedc-chaos-lab
spec:
  groups:
    - name: updatec-soak-campaign
      interval: 15s
      rules:
        - record: updatedc:soak_success:ratio
          expr: updatec_soak_successful_campaigns_total / clamp_min(updatec_soak_campaigns_total, 1)
        - record: updatedc:soak_fleet_converged:ratio
          expr: updatec_soak_fleet_converged_nodes / clamp_min(updatec_soak_fleet_expected_nodes, 1)
        - record: updatedc:soak_last_success_age_seconds
          expr: >-
            ((time() - updatec_soak_last_success_timestamp_seconds)
              and updatec_soak_last_success_timestamp_seconds > 0)
            or
            ((time() - updatec_soak_started_timestamp_seconds)
              and updatec_soak_last_success_timestamp_seconds == 0)
        - record: updatedc:soak_faults:1h
          expr: sum(increase(updatec_soak_faults_total[1h]))
        - alert: UpdatecSoakCampaignStalled
          expr: updatec_soak_bootstrap_ready == 1 and updatedc:soak_last_success_age_seconds > 900
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: updatec soak has not completed a successful campaign for 15 minutes
        - alert: UpdatecSoakCampaignFailing
          expr: updatec_soak_consecutive_failures >= 3
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: updatec soak has failed at least three consecutive campaigns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: updatec-soak-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: updatedc-chaos-lab
data:
