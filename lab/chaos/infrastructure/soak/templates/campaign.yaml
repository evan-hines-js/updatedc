apiVersion: v1
kind: ServiceAccount
metadata:
  name: updatec-soak
  labels: {{- include "soak.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: updatec-soak
  labels: {{- include "soak.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tuf-signing-keys]
    verbs: [get]
  # Kubernetes cannot resourceName-bound CREATE. The fail-closed admission policy below supplies
  # the object boundary for the sole signing Secret this identity may bootstrap.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [updated.dev]
    resources: [updaterepositories]
    resourceNames: [default]
    verbs: [get, patch]
  - apiGroups: [updated.dev]
    resources: [updategroups]
    resourceNames: [soak-a, soak-b, soak-c]
    verbs: [get, patch]
  - apiGroups: [updated.dev]
    resources: [updategroupsets]
    resourceNames: [soak-fleet]
    verbs: [get, patch]
  # CREATE cannot be resourceName-bound because the object name is not part of the authorization
  # URL. The fail-closed control-boundary policy below supplies the exact object and spec boundary.
  - apiGroups: [updated.dev]
    resources: [updaterepositories, updategroups, updategroupsets]
    verbs: [create]
  - apiGroups: [updated.dev]
    resources: [updateagents]
    verbs: [get, list, update]
  - apiGroups: [chaos-mesh.org]
    resources: [networkchaos, iochaos, podchaos]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: updatec-soak
  labels: {{- include "soak.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: updatec-soak}
subjects:
  - {kind: ServiceAccount, name: updatec-soak, namespace: {{ .Release.Namespace }}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: updatec-soak-{{ .Release.Namespace }}-signing-secret
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [secrets]
  matchConditions:
    - name: this-campaign
      expression: >-
        request.namespace == {{ .Release.Namespace | quote }} &&
        request.userInfo.username == {{ printf "system:serviceaccount:%s:updatec-soak" .Release.Namespace | quote }}
  validations:
    - expression: >-
        object.metadata.name == 'tuf-signing-keys' &&
        object.type == 'Opaque' &&
        has(object.metadata.labels) && object.metadata.labels.size() == 1 &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'updatedc-chaos-lab' &&
        (!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        object.data.size() == 5 &&
        object.data.all(key, value,
          key in ['root.pk8', 'root.next.pk8', 'targets.pk8', 'snapshot.pk8', 'timestamp.pk8'] &&
          value.size() > 0)
      message: the soak identity may create only the exact five-key TUF signing Secret
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: updatec-soak-{{ .Release.Namespace }}-signing-secret
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  policyName: updatec-soak-{{ .Release.Namespace }}-signing-secret
  validationActions: [Deny]
---
# The campaign assigns enrolled nodes to cohorts atomically. Its broad UPDATE verb is fenced here:
# every identity, repository binding, operator control, and metadata field must remain byte-for-byte
# unchanged, leaving spec.labels as the only writable field.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: updatec-soak-{{ .Release.Namespace }}-agent-labels
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [updated.dev]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [updateagents]
  matchConditions:
    - name: this-campaign
      expression: >-
        request.namespace == {{ .Release.Namespace | quote }} &&
        request.userInfo.username == {{ printf "system:serviceaccount:%s:updatec-soak" .Release.Namespace | quote }}
  validations:
    - expression: >-
        object.spec.repositoryRef == oldObject.spec.repositoryRef &&
        object.spec.identity == oldObject.spec.identity &&
        object.spec.hold == oldObject.spec.hold &&
        object.spec.cordon == oldObject.spec.cordon &&
        has(object.spec.backendAddress) == has(oldObject.spec.backendAddress) &&
        (!has(object.spec.backendAddress) || object.spec.backendAddress == oldObject.spec.backendAddress) &&
        has(object.metadata.labels) == has(oldObject.metadata.labels) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
        (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
        object.spec.labels.size() == 2 &&
        object.spec.labels.all(key, value,
          (key == 'soak.updated.dev/cohort' && value in ['soak-a', 'soak-b', 'soak-c']) ||
          (key == 'soak.updated.dev/node' && value.matches('^agent-[0-9]+$')))
      message: the soak identity may update only an agent's cohort labels
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: updatec-soak-{{ .Release.Namespace }}-agent-labels
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  policyName: updatec-soak-{{ .Release.Namespace }}-agent-labels
  validationActions: [Deny]
---
# The campaign owns exactly one repository, three groups, and one group set. Kubernetes cannot
# resourceName-bound CREATE, so this is the authoritative boundary both when those objects first
# appear and on every later apply. A compromised campaign can exercise release transitions, not
# silently widen selectors, storage authority, rollout limits, or signing-key references.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: updatec-soak-{{ .Release.Namespace }}-control-boundary
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [updated.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [updaterepositories, updategroups, updategroupsets]
  matchConditions:
    - name: this-campaign
      expression: >-
        request.namespace == {{ .Release.Namespace | quote }} &&
        request.userInfo.username == {{ printf "system:serviceaccount:%s:updatec-soak" .Release.Namespace | quote }}
  validations:
    - expression: >-
        (request.operation != 'CREATE' ||
          ((!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) &&
           (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
           (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0))) &&
        (request.operation == 'CREATE' ||
          (object.metadata.name == oldObject.metadata.name &&
           has(object.metadata.labels) == has(oldObject.metadata.labels) &&
           (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
           has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
           (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) &&
           has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
           (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
           has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
           (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences))) &&
        ((request.resource.resource == 'updaterepositories' &&
          object.metadata.name == 'default' &&
          (!has(object.metadata.labels) || object.metadata.labels.size() == 0) &&
          object.spec.signingSecretRef.name == 'tuf-signing-keys' &&
          object.spec.enrollment.labels.size() == 0 &&
          object.spec.s3.bucket == 'updates' &&
          object.spec.s3.region == 'us-east-1' &&
          has(object.spec.s3.credentialsSecretRef) &&
          object.spec.s3.credentialsSecretRef.name == 's3-credentials' &&
          has(object.spec.s3.endpoint) && object.spec.s3.endpoint == 'http://minio:9000' &&
          has(object.spec.s3.publicEndpoint) &&
          object.spec.s3.publicEndpoint == 'https://minio-direct.updated-system.svc' &&
          object.spec.assignmentPrefix == 'assignments' &&
          object.spec.stateMaxShards == 8 &&
          !has(object.spec.admissionPolicyRef)) ||
         (request.resource.resource == 'updategroups' &&
          object.metadata.name in ['soak-a', 'soak-b', 'soak-c'] &&
          has(object.metadata.labels) && object.metadata.labels.size() == 1 &&
          object.metadata.labels['soak.updated.dev/fleet'] == 'managed' &&
          object.spec.repositoryRef.name == 'default' &&
          object.spec.selector.matchLabels.size() == 1 &&
          object.spec.selector.matchLabels['soak.updated.dev/cohort'] == object.metadata.name &&
          object.spec.dependsOn.size() == 0 && object.spec.inputs.size() == 0 &&
          has(object.spec.maxUnavailable) && object.spec.maxUnavailable == 1 &&
          object.spec.emergencyCorrection == false) ||
         (request.resource.resource == 'updategroupsets' &&
          object.metadata.name == 'soak-fleet' &&
          (!has(object.metadata.labels) || object.metadata.labels.size() == 0) &&
          object.spec.repositoryRef.name == 'default' &&
          object.spec.selector.matchLabels.size() == 1 &&
          object.spec.selector.matchLabels['soak.updated.dev/fleet'] == 'managed' &&
          has(object.spec.maxConcurrent) && object.spec.maxConcurrent == 2 &&
          object.spec.rolloutWindows.size() == 0 && object.spec.calendar.size() == 0 &&
          has(object.spec.maxRegressions) && object.spec.maxRegressions == 1 &&
          object.spec.onRegression == 'rollback' &&
          has(object.spec.stuckAfterSeconds) && object.spec.stuckAfterSeconds == 300))
      message: the soak identity may own only the canonical control resources and change only deployments
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: updatec-soak-{{ .Release.Namespace }}-control-boundary
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  policyName: updatec-soak-{{ .Release.Namespace }}-control-boundary
  validationActions: [Deny]
---
# Chaos Mesh faults can reach beyond the namespace that contains their custom resource. Fence the
# campaign identity to its one labeled, round-scoped object grammar and the exact selectors and
# effects its Rust fault factory emits. DELETE is checked against oldObject so the broad dynamic
# RBAC verb cannot remove another operator's experiment.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: updatec-soak-{{ .Release.Namespace }}-chaos-boundary
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [chaos-mesh.org]
        apiVersions: [v1alpha1]
        operations: [CREATE, DELETE]
        resources: [networkchaos, iochaos, podchaos]
  matchConditions:
    - name: this-campaign
      expression: >-
        request.namespace == {{ .Release.Namespace | quote }} &&
        request.userInfo.username == {{ printf "system:serviceaccount:%s:updatec-soak" .Release.Namespace | quote }}
  variables:
    - name: candidate
      expression: >-
        request.operation == 'DELETE' ? oldObject : object
  validations:
    - expression: >-
        variables.candidate.metadata.name.matches('^soak-round-[1-9][0-9]*$') &&
        has(variables.candidate.metadata.labels) &&
        variables.candidate.metadata.labels['soak.updated.dev/campaign'] == 'managed' &&
        (request.operation != 'CREATE' ||
          (variables.candidate.metadata.labels.size() == 1 &&
           (!has(variables.candidate.metadata.annotations) || variables.candidate.metadata.annotations.size() == 0) &&
           (!has(variables.candidate.metadata.finalizers) || variables.candidate.metadata.finalizers.size() == 0) &&
           (!has(variables.candidate.metadata.ownerReferences) || variables.candidate.metadata.ownerReferences.size() == 0))) &&
        variables.candidate.spec.mode == 'all' &&
        variables.candidate.spec.selector.namespaces == [{{ .Release.Namespace | quote }}] &&
        variables.candidate.spec.selector.pods.size() == 1 &&
        variables.candidate.spec.selector.pods[{{ .Release.Namespace | quote }}].size() == 1 &&
        !has(variables.candidate.spec.duration) && !has(variables.candidate.spec.value) &&
        ((request.resource.resource == 'networkchaos' &&
          variables.candidate.spec.action == 'partition' &&
          variables.candidate.spec.direction == 'both' &&
          variables.candidate.spec.selector.pods[{{ .Release.Namespace | quote }}][0].matches('^agent-[0-9]+$') &&
          variables.candidate.spec.target.mode == 'all' &&
          variables.candidate.spec.target.selector.namespaces == [{{ .Release.Namespace | quote }}] &&
          variables.candidate.spec.target.selector.labelSelectors.size() == 1 &&
          variables.candidate.spec.target.selector.labelSelectors['updated.dev/chaos-target'] == 'true' &&
          !has(variables.candidate.spec.externalTargets) && !has(variables.candidate.spec.device)) ||
         (request.resource.resource == 'iochaos' &&
          variables.candidate.spec.action == 'fault' &&
          variables.candidate.spec.selector.pods[{{ .Release.Namespace | quote }}][0].matches('^agent-[0-9]+$') &&
          variables.candidate.spec.volumePath == '/var/lib/updated' &&
          variables.candidate.spec.path == '/var/lib/updated/*' &&
          variables.candidate.spec.errno == 5 && variables.candidate.spec.percent == 25 &&
          variables.candidate.spec.containerNames == ['agent'] && !has(variables.candidate.spec.methods)) ||
         (request.resource.resource == 'podchaos' &&
          variables.candidate.spec.action == 'pod-kill' &&
          variables.candidate.spec.selector.pods[{{ .Release.Namespace | quote }}][0].matches(
            '^(agent-[0-9]+|updatec-controller-[a-z0-9]+(-[a-z0-9]+)*)$') &&
          !has(variables.candidate.spec.gracePeriod)))
      message: the soak identity may create and delete only canonical round-scoped faults
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: updatec-soak-{{ .Release.Namespace }}-chaos-boundary
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  policyName: updatec-soak-{{ .Release.Namespace }}-chaos-boundary
  validationActions: [Deny]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: updatec-soak-state
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.campaign.statePersistence }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: updatec-soak
  labels:
    {{- include "soak.labels" . | nindent 4 }}
    app.kubernetes.io/name: updatec-soak
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: updatec-soak}
  template:
    metadata:
      labels:
        {{- include "soak.labels" . | nindent 8 }}
        app.kubernetes.io/name: updatec-soak
    spec:
      serviceAccountName: updatec-soak
      # A signaled campaign finishes its joined fault lifecycle (at most one convergence window),
      # persists the outcome, and verifies all of its labeled Chaos Mesh objects are gone.
      terminationGracePeriodSeconds: 420
      nodeSelector: {updated.dev/chaos-role: storage}
      securityContext: {{- include "soak.podSecurityContext" (dict "uid" (include "soak.runtimeUid" .)) | nindent 8 }}
      containers:
        - name: campaign
          image: {{ include "soak.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/updatec-e2e, soak]
          ports: [{name: metrics, containerPort: 9091}]
          env:
            - {name: UPDATEC_SOAK_SEED, value: {{ .Values.campaign.seed | quote }}}
            - {name: UPDATEC_SOAK_AGENT_COUNT, value: {{ .Values.agents.replicas | quote }}}
            - {name: UPDATEC_SOAK_ROUND_INTERVAL_SECONDS, value: {{ .Values.campaign.intervalSeconds | quote }}}
            - {name: UPDATEC_SOAK_FAULT_SECONDS, value: {{ .Values.campaign.faultSeconds | quote }}}
            - {name: UPDATEC_SOAK_CONVERGENCE_SECONDS, value: {{ .Values.campaign.convergenceSeconds | quote }}}
          # A replacement may wait behind the terminating process's exclusive PVC state lock for
          # the full graceful-fault budget. Do not restart that safe waiter before the owner exits.
          startupProbe: {httpGet: {path: /healthz, port: metrics}, periodSeconds: 2, failureThreshold: 240}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext: {{- include "soak.restrictedContainerSecurityContext" (dict "uid" (include "soak.runtimeUid" .)) | nindent 12 }}
          volumeMounts:
            - {name: release, mountPath: /release-data}
            - {name: state, mountPath: /state}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: release, persistentVolumeClaim: {claimName: release-repository}}
        - {name: state, persistentVolumeClaim: {claimName: updatec-soak-state}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: updatec-soak-metrics
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: updatec-soak}
  ports: [{name: metrics, port: 9091, targetPort: metrics}]
