{{- if .Values.agents.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: agents
  labels: {{- include "soak.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: updated-agent}
  ports: [{name: workload, port: 8080, targetPort: workload}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent
  labels:
    {{- include "soak.labels" . | nindent 4 }}
    app.kubernetes.io/name: updated-agent
spec:
  serviceName: agents
  replicas: {{ .Values.agents.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: updated-agent}
  template:
    metadata:
      labels:
        {{- include "soak.labels" . | nindent 8 }}
        app.kubernetes.io/name: updated-agent
        updated.dev/chaos-target: "true"
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: updated.dev/chaos-role
                    operator: In
                    values: [agent-a, agent-b]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: updated-agent}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 30
      initContainers:
        # fsGroup recursively grants group access when a PVC is remounted, which turns the
        # durable node key from 0600 into 0660. Prepare ownership explicitly instead: the agent's
        # owner-only key check then remains true across every pod replacement.
        - name: prepare-private-state
          image: {{ include "soak.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              uid={{ include "soak.agentUid" . }}
              install -d -o "$uid" -g "$uid" -m 0700 /var/lib/updated /var/lib/updated/launcher /prepared-tls
              chown -R "$uid:$uid" /var/lib/updated
              if [ -e /var/lib/updated/launcher/agent.key ]; then
                chmod 0600 /var/lib/updated/launcher/agent.key
              fi
              cp /source-tls/ca.crt /source-tls/tls.crt /source-tls/tls.key /prepared-tls/
              chown "$uid:$uid" /prepared-tls/*
              chmod 0400 /prepared-tls/ca.crt /prepared-tls/tls.crt /prepared-tls/tls.key
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER]}
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            # Chaos Mesh's toda moves the target mount to a sibling named
            # /var/lib/__chaosfs__updated__. Give that one parent a writable mount namespace while
            # keeping the rest of the container root read-only.
            - {name: chaos-mount-workspace, mountPath: /var/lib}
            - {name: state, mountPath: /var/lib/updated}
            - {name: agent-tls-source, mountPath: /source-tls, readOnly: true}
            - {name: agent-tls, mountPath: /prepared-tls}
      containers:
        - name: agent
          image: {{ include "soak.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/run-agent]
          ports: [{name: workload, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "2", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ include "soak.agentUid" . }}
            runAsGroup: {{ include "soak.agentUid" . }}
          volumeMounts:
            # toda moves /var/lib/updated to a sibling while installing its FUSE mount. The
            # writable parent is deliberately narrower than making the container root writable.
            - {name: chaos-mount-workspace, mountPath: /var/lib}
            - {name: state, mountPath: /var/lib/updated}
            - {name: tmp, mountPath: /tmp}
            - {name: agent-tls, mountPath: /etc/agent-tls, readOnly: true}
      volumes:
        - {name: chaos-mount-workspace, emptyDir: {sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
        - {name: agent-tls-source, secret: {secretName: agent-tls}}
        - {name: agent-tls, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
  volumeClaimTemplates:
    - metadata: {name: state}
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.agents.statePersistence }}}}
{{- end }}
