apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: updatedc-chaos-reliability
  namespace: monitoring
  labels:
    app.kubernetes.io/name: updatedc-chaos-reliability
    app.kubernetes.io/part-of: updatedc-chaos-lab
spec:
  groups:
    - name: updatedc-chaos-reliability
      interval: 15s
      rules:
        - record: updatedc:release_transitions:1h
          expr: max(changes(updatec_generation[1h])) or vector(0)
        - record: updatedc:fleet_settled:ratio
          expr: avg(updatec_group_progress{state="settled"})
        - record: updatedc:fleet_nodes_on_target:ratio
          expr: sum(updatec_group_nodes_on_target) / clamp_min(sum(updatec_group_nodes), 1)
        - record: updatedc:reports_fresh:ratio
          expr: updatec_reports_fresh / clamp_min(updatec_reports_fresh + updatec_reports_stale, 1)
        - record: updatedc:reconcile_age_seconds
          expr: time() - updatec_reconcile_timestamp_seconds
        - record: updatedc:reconcile_failures:1h
          expr: increase(updatec_reconcile_failures_total[1h])
        - record: updatedc:chaos_control_plane_up
          expr: max(up{job="chaos-mesh-controller"})
        - record: updatedc:kubernetes_nodes_ready:ratio
          expr: avg(kube_node_status_condition{condition="Ready",status="true"})
---
