[workspace]
resolver = "2"
members = [
    "crates/foundation",
    "crates/updated",
    "crates/updated-contracts",
    "crates/updated-tuf",
    "crates/control",
    "crates/server",
    "crates/launcher",
    "crates/agent",
    "crates/sampleapp",
    "crates/e2e",
    "crates/killfuzz",
    "crates/windows-service",
    "crates/updatec",
    "crates/updatectl",
    "crates/updatec-e2e",
    "crates/updated-healthproxy",
    "crates/demo-lifecycle",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-only"

# Pinned once here so every crate agrees on versions. All hashing and signing go
# through `aws-lc-rs` (already pulled in by the TUF client), so there is one
# crypto library, not two.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One strict operator config file shared by every update front end.
toml = { version = "0.8", default-features = false, features = ["parse"] }
semver = "1"
hex = "0.4"
# Standard base64 for DSSE envelopes (payload + signature transport). A pure data codec, same class as hex.
base64 = "0.22"
# Test-only HTTP client for the e2e harness (localhost, so no TLS).
ureq = { version = "2", default-features = false }
libc = "0.2"
# TUF is the update trust path: the mature `tough` client/editor plus a Tokio
# runtime (tough is async-native) and `url` for repository base URLs.
tough = { version = "0.24", features = ["http"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "fs",
    "io-util",
    "signal",
    "sync",
] }
url = "2"
same-file = "1"
# Every test and tool that needs scratch space gets its directory from here.
tempfile = "3"
# Pinned to match tough's own versions so the trees unify (no duplicates).
aws-lc-rs = "1"      # the one crypto lib: SHA-256, ed25519 keygen, secure RNG
jiff = "0.2"         # timestamps for TUF metadata expiry
futures = "0.3"      # stream combinators for verified target downloads
kube = { version = "1", features = ["client", "config", "derive", "runtime", "rustls-tls"] }
# Argument parsing for the CI-facing `updatectl` publisher.
clap = { version = "4", features = ["derive", "env"] }
k8s-openapi = { version = "0.25", features = ["v1_32"] }
schemars = "0.8"
async-trait = "0.1"
object_store = { version = "0.14", features = ["aws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde_yaml = "0.9"
chrono = "0.4"
tar = "0.4"          # deterministic bundle construction and streaming extraction
zstd = "0.13"        # the sole application bundle compression format
# Async HTTP for the agent's localhost health probe (no TLS needed).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
# Mint the fleet CA + gateway server cert + agent client cert (the way `server init` mints TUF
# keys), on the aws-lc-rs backend so there is one crypto library.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
x509-parser = "0.16"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # CreateJobObjectW (e2e harness) takes a SECURITY_ATTRIBUTES pointer, so its
    # signature — hence the whole function — lives behind Win32_Security.
    "Win32_Security",
    # The durable writer builds an owner-only DACL from SDDL so a private key written on
    # Windows is not readable by every local user (the unix side gets this from 0o600).
    "Win32_Security_Authorization",
    # CreateFileW: the durable writer creates its temp WITH that DACL, never widened-then-
    # narrowed, so no other user can be holding a handle when the secret is written.
    "Win32_Storage_FileSystem",
    # SetConsoleCtrlHandler: the launcher's stop-signal handling.
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
panic = "abort"
overflow-checks = true
lto = "thin"
codegen-units = 1
