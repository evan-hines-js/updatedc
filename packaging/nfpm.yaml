# nfpm builds the .deb and the .rpm from this one description, so the two packages cannot
# describe the node differently. Build with packaging/build.sh, which compiles the binaries and
# then runs `nfpm package -p deb` and `-p rpm` over this file.
#
# The package owns the agent binary and its systemd unit. Agent upgrades are intentionally handled
# by the host package/configuration manager; the agent's signed channel manages applications only.

name: updated-agent
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
section: admin
priority: optional
maintainer: updatedc <https://github.com/evan-hines-js/updatedc>
description: |
  Externally supervised release agent.
  Bootstraps a node onto an `updated` fleet; systemd supervises the package-owned agent directly,
  while workloads arrive through the fleet's signed TUF channel.
vendor: updatedc
homepage: https://github.com/evan-hines-js/updatedc
license: AGPL-3.0-only

contents:
  - src: ${PKG_BINDIR}/updated-agent
    dst: /usr/lib/updated/updated-agent
    expand: true
    file_info: {mode: 0755}

  - src: ../deploy/systemd/updated-agent.service
    dst: /usr/lib/systemd/system/updated-agent.service
    file_info: {mode: 0644}

  # Config, never overwritten on upgrade: an upgrade that rewrote a node's enrollment identity
  # would re-enroll it under a new name and orphan its rollout history.
  - src: ./etc/config.toml
    dst: /etc/updated/config.toml
    type: config|noreplace
    file_info: {mode: 0600, owner: root, group: root}
  - src: ./etc/agent.env
    dst: /etc/updated/agent.env
    type: config|noreplace
    file_info: {mode: 0644}

  # Directories the package owns so their ownership and modes are declared once, here, rather
  # than being whatever the first process to touch them happened to create.
  - dst: /etc/updated/agent-tls
    type: dir
    file_info: {mode: 0700, owner: root, group: root}
  - dst: /var/lib/updated
    type: dir
    file_info: {mode: 0700, owner: root, group: root}

  - src: ../LICENSE
    dst: /usr/share/doc/updated-agent/LICENSE
    file_info: {mode: 0644}

scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
  postremove: ./scripts/postremove.sh

overrides:
  deb:
    depends:
      - ca-certificates
    recommends:
      - systemd
  rpm:
    depends:
      - ca-certificates

rpm:
  group: System Environment/Daemons
