<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" role="img" aria-labelledby="title desc">
  <title id="title">updatedc fleet update architecture</title>
  <desc id="desc">A control plane sends signed releases through a network to a fleet of node agents, represented by indigo and cyan geometric forms.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b17"/>
      <stop offset=".52" stop-color="#10142a"/>
      <stop offset="1" stop-color="#090d1d"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset=".48" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brand-soft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#6366f1" stop-opacity=".32"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#a5b4fc" stroke-opacity=".055"/>
    </pattern>
    <style>
      .line { fill:none; stroke:#818cf8; stroke-width:2; stroke-linecap:round; stroke-dasharray:2 9; opacity:.46 }
      .node-shell { fill:#11172d; stroke:#6f79d9; stroke-width:1.5 }
      .node-top { fill:url(#brand-soft) }
      .node-side { fill:#4f46a5 }
      .node-face { fill:#232c62 }
      .label { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.12em }
    </style>
  </defs>

  <rect width="1200" height="560" rx="32" fill="url(#backdrop)"/>
  <rect width="1200" height="560" rx="32" fill="url(#grid)"/>
  <ellipse cx="770" cy="275" rx="380" ry="275" fill="url(#halo)"/>

  <!-- Product mark -->
  <g transform="translate(72 72)">
    <rect width="58" height="58" rx="17" fill="url(#brand)" filter="url(#shadow)"/>
    <path d="M17 18v17c0 7 5 11 12 11s12-4 12-11V18M41 31H28" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="43" fill="#f4f5ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="45" font-weight="720" letter-spacing="-2">updatedc</text>
    <text x="80" y="74" fill="#9199b8" class="label" font-size="12">SIGNED FLEET UPDATES</text>
  </g>

  <!-- The shared signed distribution path -->
  <path class="line" d="M394 315C473 315 471 207 563 207"/>
  <path class="line" d="M394 315C487 315 497 315 590 315"/>
  <path class="line" d="M394 315C473 315 471 423 563 423"/>
  <path class="line" d="M787 207C875 207 875 121 962 121"/>
  <path class="line" d="M814 315H995"/>
  <path class="line" d="M787 423C875 423 875 489 962 489"/>

  <!-- Moving signed artifacts -->
  <g fill="#67e8f9">
    <circle r="4"><animateMotion dur="4.8s" repeatCount="indefinite" path="M394 315C473 315 471 207 563 207"/></circle>
    <circle r="4"><animateMotion dur="5.6s" begin="-2s" repeatCount="indefinite" path="M394 315C487 315 497 315 590 315"/></circle>
    <circle r="4"><animateMotion dur="5.2s" begin="-3.4s" repeatCount="indefinite" path="M394 315C473 315 471 423 563 423"/></circle>
  </g>

  <!-- updatec: control plane -->
  <g transform="translate(170 235)" filter="url(#shadow)">
    <circle cx="112" cy="80" r="116" fill="#6366f1" opacity=".15" filter="url(#glow)"/>
    <path d="M112 0 210 56v112l-98 56-98-56V56Z" fill="#11172d" stroke="url(#brand)" stroke-width="3"/>
    <path d="M112 25 188 68v87l-76 44-76-44V68Z" fill="#171e3c" stroke="#6d75c7" stroke-width="1.5"/>
    <circle cx="112" cy="112" r="43" fill="none" stroke="url(#brand-soft)" stroke-width="9" stroke-linecap="round" stroke-dasharray="192 80" transform="rotate(-40 112 112)"/>
    <path d="m96 111 12 12 24-27" fill="none" stroke="#e8eaff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="258" text-anchor="middle" fill="#eef0ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="650">updatec</text>
    <text x="112" y="282" text-anchor="middle" fill="#7f89aa" class="label" font-size="10">CONTROL PLANE</text>
  </g>

  <!-- Reusable-looking node agents, laid out as a fleet -->
  <g transform="translate(558 151)">
    <g filter="url(#shadow)">
      <rect class="node-shell" width="230" height="112" rx="22"/>
      <path d="M31 40 55 26l24 14v28L55 82 31 68Z" class="node-face"/>
      <path d="m31 40 24 14 24-14-24-14Z" class="node-top"/>
      <path d="m55 54 24-14v28L55 82Z" class="node-side"/>
      <circle cx="198" cy="30" r="5" fill="#22d3ee"/>
      <text x="99" y="54" fill="#eef0ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="650">updated</text>
      <text x="99" y="76" fill="#7883a5" class="label" font-size="9">NODE AGENT</text>
    </g>
  </g>
  <g transform="translate(590 259)">
    <g filter="url(#shadow)">
      <rect class="node-shell" width="230" height="112" rx="22"/>
      <path d="M31 40 55 26l24 14v28L55 82 31 68Z" class="node-face"/>
      <path d="m31 40 24 14 24-14-24-14Z" class="node-top"/>
      <path d="m55 54 24-14v28L55 82Z" class="node-side"/>
      <circle cx="198" cy="30" r="5" fill="#a78bfa"/>
      <text x="99" y="54" fill="#eef0ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="650">updated</text>
      <text x="99" y="76" fill="#7883a5" class="label" font-size="9">NODE AGENT</text>
    </g>
  </g>
  <g transform="translate(558 367)">
    <g filter="url(#shadow)">
      <rect class="node-shell" width="230" height="112" rx="22"/>
      <path d="M31 40 55 26l24 14v28L55 82 31 68Z" class="node-face"/>
      <path d="m31 40 24 14 24-14-24-14Z" class="node-top"/>
      <path d="m55 54 24-14v28L55 82Z" class="node-side"/>
      <circle cx="198" cy="30" r="5" fill="#22d3ee"/>
      <text x="99" y="54" fill="#eef0ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="650">updated</text>
      <text x="99" y="76" fill="#7883a5" class="label" font-size="9">NODE AGENT</text>
    </g>
  </g>

  <!-- Fleet continuation: abstract, compact, unmistakably many nodes -->
  <g opacity=".9">
    <g transform="translate(962 83)">
      <rect width="132" height="76" rx="17" class="node-shell"/>
      <path d="m24 27 15-9 15 9v18l-15 9-15-9Z" fill="url(#brand)"/>
      <path d="M70 29h37M70 43h25" stroke="#717b9e" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(995 277)">
      <rect width="132" height="76" rx="17" class="node-shell"/>
      <path d="m24 27 15-9 15 9v18l-15 9-15-9Z" fill="url(#brand)"/>
      <path d="M70 29h37M70 43h25" stroke="#717b9e" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(962 451)">
      <rect width="132" height="76" rx="17" class="node-shell"/>
      <path d="m24 27 15-9 15 9v18l-15 9-15-9Z" fill="url(#brand)"/>
      <path d="M70 29h37M70 43h25" stroke="#717b9e" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <text x="1128" y="405" text-anchor="end" fill="#545e82" class="label" font-size="10">FLEET / 06</text>
</svg>
